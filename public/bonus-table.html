<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bonus jadvali — KPI Bonus</title>
<script>(function(){var t=localStorage.getItem('kpi_theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#080b14">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <div class="section" style="margin-top:0;">
      <h2 style="margin-top:0;">Bonus jadvali</h2>
      <p class="journal-sub">Har bir kategoriya bo'yicha, qancha sotilsa qanday bonus tegishi ko'rsatilgan. Bu jadval faqat ko'rish uchun.</p>
      <div class="field" style="max-width:220px; margin-bottom:14px;">
        <label for="tariff-date">Qaysi sanadagi tarif</label>
        <input type="date" id="tariff-date">
      </div>
      <div id="categories-wrap">Yuklanmoqda...</div>
    </div>
  </div>

  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/topbar.js"></script>
  <script src="/js/categoryOrder.js"></script>
  <script>
    requireSection('bonus_table');
    renderTopbar('bonus_table');

    async function loadBonusTable() {
      const wrap = document.getElementById('categories-wrap');
      try {
        const dateStr = document.getElementById('tariff-date').value;
        const data = await apiFetch('/bonus/tiers' + (dateStr ? '?date=' + encodeURIComponent(dateStr) : ''));
        wrap.innerHTML = '';
        const cats = sortByCategoryOrder(Object.keys(data.categories));
        cats.forEach((category) => {
          const cfg = data.categories[category];
          const row = document.createElement('div');
          row.className = 'category-row';
          row.innerHTML = `
            <div class="cat-name">${category} <span style="color:var(--text-dim); font-weight:400;">(${cfg.unit === 'kg' ? 'kg' : 'dona'})</span></div>
            <div class="tier-grid">
              ${cfg.tiers.map((t) => `
                <div class="tier-cell">
                  <div class="range">${t.min}${t.max ? '–' + t.max : '+'} ${cfg.unit === 'kg' ? 'kg' : 'dona'}</div>
                  <div style="padding:6px 8px; font-size:14px; font-weight:600; color:var(--accent);">${formatMoney(t.bonus)}</div>
                </div>
              `).join('')}
            </div>
          `;
          wrap.appendChild(row);
        });
      } catch (e) {
        wrap.innerHTML = '<div class="error-msg">Yuklashda xato: ' + e.message + '</div>';
      }
    }

    document.getElementById('tariff-date').value = todayStr();
    document.getElementById('tariff-date').addEventListener('change', loadBonusTable);
    loadBonusTable();
  </script>
<script src="/js/pwa.js"></script>
</body>
</html>
